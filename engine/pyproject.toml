[project]
name = "bellwether"
version = "0.1.0"
description = "Multi-agent analysis engine with token-level streaming and a determinism layer"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "jsonschema>=4.22",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
bellwether = "bellwether.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bellwether*"]

[tool.setuptools.package-data]
bellwether = ["corpus/data/*.json", "cassettes/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:bellwether.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
packages = ["bellwether"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["anthropic.*", "jsonschema.*"]
ignore_missing_imports = true
